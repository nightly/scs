name: Temporary Marimo validation package

on:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Marimo
        run: |
          python -m venv /tmp/marimo-venv
          /tmp/marimo-venv/bin/python -m pip install --upgrade pip
          /tmp/marimo-venv/bin/python -m pip install "marimo>=0.24.0"
          /tmp/marimo-venv/bin/marimo --version | tee /tmp/marimo-version.txt
          site_packages=$(
            /tmp/marimo-venv/bin/python -c \
              'import sysconfig; print(sysconfig.get_paths()["purelib"])'
          )
          tar -C "$(dirname "$site_packages")" \
            -czf /tmp/marimo-site-packages.tar.gz \
            "$(basename "$site_packages")"
      - uses: actions/upload-artifact@v4
        with:
          name: marimo-validation-runtime
          path: |
            /tmp/marimo-site-packages.tar.gz
            /tmp/marimo-version.txt
          retention-days: 1
